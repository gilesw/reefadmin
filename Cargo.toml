[package]
name = "reefadmin"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A Django-inspired, server-rendered admin for Axum and SeaORM, with Loco integration"
readme = "README.md"
repository = "https://github.com/gilesw/reefadmin"
rust-version = "1.98.1"
authors = ["Giles Westwood"]
publish = ["crates-io"]
keywords = ["admin", "seaorm", "axum", "loco", "crud"]
categories = ["database", "web-programming"]
include = ["/src/**/*.rs", "/templates/**", "/static/**", "/tests/**/*.rs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/docs/**", "/PLAN.md"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
absolute_paths = "warn"
uninlined_format_args = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
self_named_module_files = "warn"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "query", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1.4"
email_address = { version = "0.2.9", default-features = false }
form_urlencoded = "1"
tera = "2.4"
percent-encoding = "2"
regex = "1"
sea-orm = { version = "2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
