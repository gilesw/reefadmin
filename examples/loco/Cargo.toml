[package]
name = "reefadmin-loco-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace]

[dependencies]
reefadmin = { path = "../.." }
loco-rs = { version = "=1.2.0", default-features = false, features = ["with-db", "db-sqlite"] }
axum = { version = "0.8", features = ["form"] }
axum-extra = { version = "0.10", features = ["cookie-signed"] }
async-trait = "0.1"
sea-orm = { version = "2.0", features = ["macros", "sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
time = "0.3"
form_urlencoded = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
