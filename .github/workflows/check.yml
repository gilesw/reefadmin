name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loco-admin
          POSTGRES_PASSWORD: loco-admin
          POSTGRES_DB: loco_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCO_ADMIN_TEST_DATABASE_URL: postgres://loco-admin:loco-admin@localhost:5432/loco_admin_test
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: mise run setup
      - run: mise run check:postgres
      - run: mise run browser:setup
      - run: mise run test:browser
      - name: Assert checks left the checkout unchanged
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            git diff
            exit 1
          fi

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loco-admin
          POSTGRES_PASSWORD: loco-admin
          POSTGRES_DB: loco_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCO_ADMIN_TEST_DATABASE_URL: postgres://loco-admin:loco-admin@localhost:5432/loco_admin_test
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - run: mise run setup
      - run: mise run coverage:check
      - name: Retain coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: warn
          retention-days: 14
